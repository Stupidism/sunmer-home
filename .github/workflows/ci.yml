name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.detect.outputs.matrix_json }}
      affected_count: ${{ steps.detect.outputs.affected_count }}
    steps:
      - name: Detect affected apps
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const projects = [
              {
                appId: 'bubu-log',
                appPath: 'apps/bubu-log',
                triggers: ['apps/bubu-log/', 'packages/ui/', 'packages/log-ui/', 'packages/typescript-config/'],
                hasLint: true,
                hasE2E: true,
              },
              {
                appId: 'nunu-island',
                appPath: 'apps/nunu-island',
                triggers: ['apps/nunu-island/', 'packages/ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'nunu-log',
                appPath: 'apps/nunu-log',
                triggers: ['apps/nunu-log/', 'packages/ui/', 'packages/log-ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'wedding-invite',
                appPath: 'apps/wedding-invite',
                triggers: ['apps/wedding-invite/', 'packages/ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'weekly-menu',
                appPath: 'apps/weekly-menu',
                triggers: ['apps/weekly-menu/', 'packages/ui/', 'packages/typescript-config/'],
              },
            ]

            const alwaysAffectAll = [
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'package.json',
              'turbo.json',
              '.github/workflows/ci.yml',
            ]

            let changed = []
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              })
              changed = files.map((f) => f.filename)
            } else {
              // push to main: run everything
              changed = ['pnpm-lock.yaml']
            }

            const affectAll = changed.some((file) =>
              alwaysAffectAll.some((prefix) => file === prefix || file.startsWith(prefix))
            )

            const affected = projects.filter((project) => {
              if (affectAll) return true
              return changed.some((file) => project.triggers.some((prefix) => file.startsWith(prefix)))
            })

            core.info(`Changed files: ${changed.length}`)
            core.info(`Affect all: ${affectAll}`)
            core.info(`Affected apps: ${affected.map((p) => p.appId).join(', ') || '(none)'}`)

            core.setOutput('matrix_json', JSON.stringify({ include: affected }))
            core.setOutput('affected_count', String(affected.length))

  ci:
    needs: detect-affected
    if: needs.detect-affected.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.matrix_json) }}
    env:
      AUTH_SECRET: test-secret
      AUTH_TRUST_HOST: true
      NEXTAUTH_URL: http://localhost:3210
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      GITHUB_CLIENT_ID: test
      GITHUB_CLIENT_SECRET: test
      WECHAT_APP_ID: test
      WECHAT_APP_SECRET: test
      DEEPSEEK_API_KEY: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        if: matrix.hasLint
        run: pnpm -C ${{ matrix.appPath }} lint

      - name: Type check
        run: pnpm -C ${{ matrix.appPath }} exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter ${{ matrix.appId }} test --if-present

      - name: Install Playwright browsers
        if: matrix.hasE2E
        run: pnpm -C ${{ matrix.appPath }} exec playwright install --with-deps

      - name: E2E tests
        if: matrix.hasE2E
        run: pnpm -C ${{ matrix.appPath }} test:e2e
