name: E2B PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  detect-affected:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.detect.outputs.matrix_json }}
      all_projects_json: ${{ steps.detect.outputs.all_projects_json }}
      affected_json: ${{ steps.detect.outputs.affected_json }}
      preview_count: ${{ steps.detect.outputs.preview_count }}
    steps:
      - name: Detect affected projects for E2B preview
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const pull_number = context.payload.pull_request.number

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            })

            const changed = files.map((f) => f.filename)
            const alwaysAffectAll = [
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'package.json',
              'turbo.json',
            ]

            const projects = [
              {
                appId: 'bubu-log',
                appName: 'bubu-log',
                appPath: 'apps/bubu-log',
                appPort: 1030,
                pnpmFilters: 'bubu-log,@bubu-log/ui,@bubu-log/log-ui,@bubu-log/typescript-config',
                triggers: ['apps/bubu-log/', 'packages/ui/', 'packages/log-ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'nunu-island',
                appName: 'nunu-island',
                appPath: 'apps/nunu-island',
                appPort: 1040,
                pnpmFilters: 'nunu-island,@bubu-log/ui,@bubu-log/typescript-config',
                triggers: ['apps/nunu-island/', 'packages/ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'nunu-log',
                appName: 'nunu-log',
                appPath: 'apps/nunu-log',
                appPort: 1050,
                pnpmFilters: 'nunu-log,@bubu-log/ui,@bubu-log/log-ui,@bubu-log/typescript-config',
                triggers: ['apps/nunu-log/', 'packages/ui/', 'packages/log-ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'wedding-invite',
                appName: 'wedding-invite',
                appPath: 'apps/wedding-invite',
                appPort: 1060,
                pnpmFilters: 'wedding-invite,@bubu-log/ui,@bubu-log/typescript-config',
                triggers: ['apps/wedding-invite/', 'packages/ui/', 'packages/typescript-config/'],
              },
            ]

            const affectAll = changed.some((file) =>
              alwaysAffectAll.some((prefix) => file === prefix || file.startsWith(prefix))
            )

            const affected = projects.filter((project) => {
              if (affectAll) return true
              return changed.some((file) => project.triggers.some((prefix) => file.startsWith(prefix)))
            })

            core.info(`Changed files: ${changed.length}`)
            core.info(`Affect all projects: ${affectAll}`)
            core.info(`Affected projects: ${affected.map((p) => p.appId).join(', ') || '(none)'}`)

            core.setOutput('matrix_json', JSON.stringify({ include: affected }))
            core.setOutput('all_projects_json', JSON.stringify(projects.map((p) => ({ appId: p.appId, appName: p.appName }))))
            core.setOutput('affected_json', JSON.stringify(affected.map((p) => ({ appId: p.appId, appName: p.appName }))))
            core.setOutput('preview_count', String(affected.length))

  preview:
    needs: detect-affected
    if: needs.detect-affected.outputs.preview_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.matrix_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2B SDK
        run: npm install --no-save e2b@2.13.0

      - name: Resolve app-specific E2B credentials
        id: resolve
        env:
          BUBU_LOG_E2B_API_KEY: ${{ secrets.BUBU_LOG_E2B_API_KEY }}
          BUBU_LOG_E2B_PREVIEW_ENV_B64: ${{ secrets.E2B_PREVIEW_ENV_B64 }}
          BUBU_LOG_E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE }}
          BUBU_LOG_E2B_TIMEOUT_MS: ${{ vars.E2B_TIMEOUT_MS }}
          BUBU_LOG_E2B_REQUEST_TIMEOUT_MS: ${{ vars.E2B_REQUEST_TIMEOUT_MS }}

          NUNU_ISLAND_E2B_API_KEY: ${{ secrets.NUNU_ISLAND_E2B_API_KEY }}
          NUNU_ISLAND_E2B_PREVIEW_ENV_B64: ${{ secrets.NUNU_ISLAND_E2B_PREVIEW_ENV_B64 }}
          NUNU_ISLAND_E2B_TEMPLATE: ${{ vars.NUNU_ISLAND_E2B_TEMPLATE }}
          NUNU_ISLAND_E2B_TIMEOUT_MS: ${{ vars.NUNU_ISLAND_E2B_TIMEOUT_MS }}
          NUNU_ISLAND_E2B_REQUEST_TIMEOUT_MS: ${{ vars.NUNU_ISLAND_E2B_REQUEST_TIMEOUT_MS }}

          NUNU_LOG_E2B_API_KEY: ${{ secrets.NUNU_LOG_E2B_API_KEY }}
          NUNU_LOG_E2B_PREVIEW_ENV_B64: ${{ secrets.NUNU_LOG_E2B_PREVIEW_ENV_B64 }}
          NUNU_LOG_E2B_TEMPLATE: ${{ vars.NUNU_LOG_E2B_TEMPLATE }}
          NUNU_LOG_E2B_TIMEOUT_MS: ${{ vars.NUNU_LOG_E2B_TIMEOUT_MS }}
          NUNU_LOG_E2B_REQUEST_TIMEOUT_MS: ${{ vars.NUNU_LOG_E2B_REQUEST_TIMEOUT_MS }}

          WEDDING_INVITE_E2B_API_KEY: ${{ secrets.WEDDING_INVITE_E2B_API_KEY }}
          WEDDING_INVITE_E2B_PREVIEW_ENV_B64: ${{ secrets.WEDDING_INVITE_E2B_PREVIEW_ENV_B64 }}
          WEDDING_INVITE_E2B_TEMPLATE: ${{ vars.WEDDING_INVITE_E2B_TEMPLATE }}
          WEDDING_INVITE_E2B_TIMEOUT_MS: ${{ vars.WEDDING_INVITE_E2B_TIMEOUT_MS }}
          WEDDING_INVITE_E2B_REQUEST_TIMEOUT_MS: ${{ vars.WEDDING_INVITE_E2B_REQUEST_TIMEOUT_MS }}
        run: |
          APP_ID='${{ matrix.appId }}'

          API_KEY=''
          PREVIEW_ENV_B64=''
          TEMPLATE=''
          TIMEOUT_MS=''
          REQUEST_TIMEOUT_MS=''

          case "$APP_ID" in
            bubu-log)
              API_KEY="$BUBU_LOG_E2B_API_KEY"
              PREVIEW_ENV_B64="$BUBU_LOG_E2B_PREVIEW_ENV_B64"
              TEMPLATE="$BUBU_LOG_E2B_TEMPLATE"
              TIMEOUT_MS="$BUBU_LOG_E2B_TIMEOUT_MS"
              REQUEST_TIMEOUT_MS="$BUBU_LOG_E2B_REQUEST_TIMEOUT_MS"
              ;;
            nunu-island)
              API_KEY="${NUNU_ISLAND_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              PREVIEW_ENV_B64="${NUNU_ISLAND_E2B_PREVIEW_ENV_B64:-$BUBU_LOG_E2B_PREVIEW_ENV_B64}"
              TEMPLATE="${NUNU_ISLAND_E2B_TEMPLATE:-$BUBU_LOG_E2B_TEMPLATE}"
              TIMEOUT_MS="${NUNU_ISLAND_E2B_TIMEOUT_MS:-$BUBU_LOG_E2B_TIMEOUT_MS}"
              REQUEST_TIMEOUT_MS="${NUNU_ISLAND_E2B_REQUEST_TIMEOUT_MS:-$BUBU_LOG_E2B_REQUEST_TIMEOUT_MS}"
              ;;
            nunu-log)
              API_KEY="${NUNU_LOG_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              PREVIEW_ENV_B64="${NUNU_LOG_E2B_PREVIEW_ENV_B64:-$BUBU_LOG_E2B_PREVIEW_ENV_B64}"
              TEMPLATE="${NUNU_LOG_E2B_TEMPLATE:-$BUBU_LOG_E2B_TEMPLATE}"
              TIMEOUT_MS="${NUNU_LOG_E2B_TIMEOUT_MS:-$BUBU_LOG_E2B_TIMEOUT_MS}"
              REQUEST_TIMEOUT_MS="${NUNU_LOG_E2B_REQUEST_TIMEOUT_MS:-$BUBU_LOG_E2B_REQUEST_TIMEOUT_MS}"
              ;;
            wedding-invite)
              API_KEY="${WEDDING_INVITE_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              PREVIEW_ENV_B64="${WEDDING_INVITE_E2B_PREVIEW_ENV_B64:-$BUBU_LOG_E2B_PREVIEW_ENV_B64}"
              TEMPLATE="${WEDDING_INVITE_E2B_TEMPLATE:-$BUBU_LOG_E2B_TEMPLATE}"
              TIMEOUT_MS="${WEDDING_INVITE_E2B_TIMEOUT_MS:-$BUBU_LOG_E2B_TIMEOUT_MS}"
              REQUEST_TIMEOUT_MS="${WEDDING_INVITE_E2B_REQUEST_TIMEOUT_MS:-$BUBU_LOG_E2B_REQUEST_TIMEOUT_MS}"
              ;;
            *)
              ;;
          esac

          if [ -z "$API_KEY" ] || [ -z "$PREVIEW_ENV_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-credentials" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          fi

          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "preview_env_b64=$PREVIEW_ENV_B64" >> "$GITHUB_OUTPUT"
          echo "template=$TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "timeout_ms=$TIMEOUT_MS" >> "$GITHUB_OUTPUT"
          echo "request_timeout_ms=${REQUEST_TIMEOUT_MS:-60000}" >> "$GITHUB_OUTPUT"

      - name: Create E2B preview sandbox
        id: create_preview
        if: steps.resolve.outputs.enabled == 'true'
        continue-on-error: true
        run: node .github/scripts/e2b-preview.mjs create
        env:
          E2B_API_KEY: ${{ steps.resolve.outputs.api_key }}
          E2B_TEMPLATE: ${{ steps.resolve.outputs.template }}
          E2B_TIMEOUT_MS: ${{ steps.resolve.outputs.timeout_ms }}
          E2B_REQUEST_TIMEOUT_MS: ${{ steps.resolve.outputs.request_timeout_ms }}
          E2B_APP_ID: ${{ matrix.appId }}
          E2B_APP_NAME: ${{ matrix.appName }}
          E2B_APP_PORT: ${{ matrix.appPort }}
          E2B_APP_PATH: ${{ matrix.appPath }}
          E2B_PNPM_FILTERS: ${{ matrix.pnpmFilters }}
          E2B_PREVIEW_ENV_B64: ${{ steps.resolve.outputs.preview_env_b64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2B_LOG_FILE: ${{ runner.temp }}/e2b-preview-${{ matrix.appId }}.log

      - name: Persist preview result
        run: |
          mkdir -p "$RUNNER_TEMP/e2b-result"
          RESULT_FILE="$RUNNER_TEMP/e2b-result/${{ matrix.appId }}.json"

          if [ '${{ steps.resolve.outputs.enabled }}' != 'true' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "skipped",
            "reason": "missing-credentials"
          }
          EOF
          elif [ '${{ steps.create_preview.outcome }}' = 'success' ]; then
            cat > "$RESULT_FILE" <<EOF
          ${{ steps.create_preview.outputs.result_json }}
          EOF
          else
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "preview-create-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          fi

      - name: Upload E2B preview logs
        if: always() && steps.resolve.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2b-preview-log-${{ matrix.appId }}-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/e2b-preview-${{ matrix.appId }}.log
          if-no-files-found: warn

      - name: Upload E2B preview result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2b-preview-result-${{ matrix.appId }}
          path: ${{ runner.temp }}/e2b-result/${{ matrix.appId }}.json
          if-no-files-found: error

  e2e-preview-nunu-island:
    needs:
      - detect-affected
      - preview
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(needs.detect-affected.outputs.affected_json, 'nunu-island')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download nunu-island preview result
        uses: actions/download-artifact@v4
        with:
          name: e2b-preview-result-nunu-island
          path: ${{ runner.temp }}/e2b-result

      - name: Resolve preview URL
        id: resolve_preview_url
        run: |
          RESULT_FILE="${RUNNER_TEMP}/e2b-result/nunu-island.json"
          if [ ! -f "$RESULT_FILE" ]; then
            echo "Missing preview result file: $RESULT_FILE"
            exit 1
          fi

          PREVIEW_URL=$(node -e "const fs=require('fs'); const result=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(result.status!=='ready'||!result.previewUrl){process.exit(2)} process.stdout.write(result.previewUrl)" "$RESULT_FILE") || {
            echo "nunu-island preview is not ready, cannot run E2E"
            cat "$RESULT_FILE"
            exit 1
          }

          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "Running E2E against ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browsers
        run: pnpm -C apps/nunu-island exec playwright install --with-deps chromium

      - name: Run nunu-island E2E against E2B preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_preview_url.outputs.preview_url }}
        run: pnpm -C apps/nunu-island test:e2e:run tests/template-record-persistence-api.spec.ts

  comment-preview:
    needs:
      - detect-affected
      - preview
      - e2e-preview-nunu-island
    if: >
      always() &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download E2B preview result artifacts
        if: needs.detect-affected.outputs.preview_count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: e2b-preview-result-*
          path: ${{ runner.temp }}/e2b-results
          merge-multiple: true

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          PREVIEW_COUNT: ${{ needs.detect-affected.outputs.preview_count }}
          ALL_PROJECTS_JSON: ${{ needs.detect-affected.outputs.all_projects_json }}
          AFFECTED_JSON: ${{ needs.detect-affected.outputs.affected_json }}
          RESULT_DIR: ${{ runner.temp }}/e2b-results
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')

            const marker = '<!-- e2b-pr-preview -->'
            const allProjects = JSON.parse(process.env.ALL_PROJECTS_JSON || '[]')
            const affectedProjects = JSON.parse(process.env.AFFECTED_JSON || '[]')
            const affectedSet = new Set(affectedProjects.map((item) => item.appId))
            const resultDir = process.env.RESULT_DIR

            const results = []
            if (process.env.PREVIEW_COUNT !== '0' && fs.existsSync(resultDir)) {
              for (const entry of fs.readdirSync(resultDir)) {
                if (!entry.endsWith('.json')) continue
                const filePath = path.join(resultDir, entry)
                try {
                  const parsed = JSON.parse(fs.readFileSync(filePath, 'utf8'))
                  results.push(parsed)
                } catch (error) {
                  core.warning(`Failed to parse ${entry}: ${error}`)
                }
              }
            }

            const resultByAppId = new Map(results.map((item) => [item.appId, item]))

            const rows = []
            const skippedRows = []

            const now = new Date()
            const updated = now.toISOString().replace('T', ' ').replace(/\.\d+Z$/, 'Z')

            const makeRow = (project, result, fallbackStatus) => {
              const status = result?.status || fallbackStatus
              const icon = status === 'ready' ? '![Ready](https://vercel.com/static/status/ready.svg)' : status === 'failed' ? '![Error](https://vercel.com/static/status/error.svg)' : '![Skipped](https://vercel.com/static/status/canceled.svg)'
              const statusLabel = status === 'ready' ? 'Ready' : status === 'failed' ? 'Failed' : 'Skipped'
              const deployment = `${icon} ${statusLabel}`

              const actions = []
              if (result?.previewUrl) {
                actions.push(`[Preview](${result.previewUrl})`)
              }
              if (result?.sandboxId) {
                actions.push(`Sandbox: \`${result.sandboxId}\``)
              }
              if (result?.runUrl || status !== 'ready') {
                actions.push(`[Logs](${result?.runUrl || process.env.RUN_URL})`)
              }

              return `| ${project.appName} | ${deployment} | ${actions.join(', ') || '-'} | ${updated} |`
            }

            for (const project of allProjects) {
              if (!affectedSet.has(project.appId)) {
                skippedRows.push(makeRow(project, null, 'skipped'))
                continue
              }

              const result = resultByAppId.get(project.appId)
              if (!result) {
                rows.push(makeRow(project, { status: 'failed', runUrl: process.env.RUN_URL }, 'failed'))
                continue
              }

              if (result.status === 'ready') {
                rows.push(makeRow(project, result, 'ready'))
              } else if (result.status === 'failed') {
                rows.push(makeRow(project, result, 'failed'))
              } else {
                skippedRows.push(makeRow(project, result, 'skipped'))
              }
            }

            const header = [
              marker,
              '### E2B Preview',
              '',
              '| Project | Deployment | Actions | Updated (UTC) |',
              '| :--- | :----- | :------ | :------ |',
            ]

            const bodyParts = [...header]
            if (rows.length > 0) {
              bodyParts.push(...rows)
            } else {
              bodyParts.push('| (none) | ![Skipped](https://vercel.com/static/status/canceled.svg) Skipped | No affected projects | ' + updated + ' |')
            }

            if (skippedRows.length > 0) {
              bodyParts.push('')
              bodyParts.push(`<details><summary>${skippedRows.length} Skipped Projects</summary>`)
              bodyParts.push('')
              bodyParts.push('| Project | Deployment | Actions | Updated (UTC) |')
              bodyParts.push('| :--- | :----- | :------ | :------ |')
              bodyParts.push(...skippedRows)
              bodyParts.push('</details>')
            }

            bodyParts.push('')
            bodyParts.push('_This preview is ephemeral and will be recreated on new commits._')

            const body = bodyParts.join('\n')

            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              })
            }

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - appId: bubu-log
            appName: bubu-log
          - appId: nunu-island
            appName: nunu-island
          - appId: nunu-log
            appName: nunu-log
          - appId: wedding-invite
            appName: wedding-invite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2B SDK
        run: npm install --no-save e2b@2.13.0

      - name: Resolve cleanup API key
        id: resolve_cleanup
        env:
          BUBU_LOG_E2B_API_KEY: ${{ secrets.BUBU_LOG_E2B_API_KEY }}
          NUNU_ISLAND_E2B_API_KEY: ${{ secrets.NUNU_ISLAND_E2B_API_KEY }}
          NUNU_LOG_E2B_API_KEY: ${{ secrets.NUNU_LOG_E2B_API_KEY }}
          WEDDING_INVITE_E2B_API_KEY: ${{ secrets.WEDDING_INVITE_E2B_API_KEY }}
        run: |
          APP_ID='${{ matrix.appId }}'
          API_KEY=''

          case "$APP_ID" in
            bubu-log)
              API_KEY="$BUBU_LOG_E2B_API_KEY"
              ;;
            nunu-island)
              API_KEY="${NUNU_ISLAND_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              ;;
            nunu-log)
              API_KEY="${NUNU_LOG_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              ;;
            wedding-invite)
              API_KEY="${WEDDING_INVITE_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              ;;
            *)
              ;;
          esac

          if [ -z "$API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"

      - name: Cleanup E2B preview sandbox
        id: cleanup_preview
        if: steps.resolve_cleanup.outputs.enabled == 'true'
        run: node .github/scripts/e2b-preview.mjs cleanup
        env:
          E2B_API_KEY: ${{ steps.resolve_cleanup.outputs.api_key }}
          E2B_REQUEST_TIMEOUT_MS: 60000
          E2B_APP_ID: ${{ matrix.appId }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          E2B_LOG_FILE: ${{ runner.temp }}/e2b-preview-cleanup-${{ matrix.appId }}.log

      - name: Upload E2B cleanup logs
        if: always() && steps.resolve_cleanup.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2b-preview-cleanup-log-${{ matrix.appId }}-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/e2b-preview-cleanup-${{ matrix.appId }}.log
          if-no-files-found: warn
