name: E2B PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  detect-affected:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.detect.outputs.matrix_json }}
      all_projects_json: ${{ steps.detect.outputs.all_projects_json }}
      affected_json: ${{ steps.detect.outputs.affected_json }}
      preview_count: ${{ steps.detect.outputs.preview_count }}
    steps:
      - name: Detect affected projects for E2B preview
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const pull_number = context.payload.pull_request.number

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            })

            const changed = files.map((f) => f.filename)
            const alwaysAffectAll = [
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              'package.json',
              'turbo.json',
              '.github/scripts/e2b-preview.mjs',
              '.github/workflows/e2b-preview.yml',
            ]

            const projects = [
              {
                appId: 'bubu-log',
                appName: 'bubu-log',
                appPath: 'apps/bubu-log',
                appPort: 1030,
                pnpmFilters: 'bubu-log,@bubu-log/ui,@bubu-log/log-ui,@bubu-log/typescript-config',
                triggers: ['apps/bubu-log/', 'packages/ui/', 'packages/log-ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'nunu-island',
                appName: 'nunu-island',
                appPath: 'apps/nunu-island',
                appPort: 1040,
                pnpmFilters: 'nunu-island,@bubu-log/ui,@bubu-log/typescript-config',
                triggers: ['apps/nunu-island/', 'packages/ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'nunu-log',
                appName: 'nunu-log',
                appPath: 'apps/nunu-log',
                appPort: 1050,
                pnpmFilters: 'nunu-log,@bubu-log/ui,@bubu-log/log-ui,@bubu-log/typescript-config',
                triggers: ['apps/nunu-log/', 'packages/ui/', 'packages/log-ui/', 'packages/typescript-config/'],
              },
              {
                appId: 'wedding-invite',
                appName: 'wedding-invite',
                appPath: 'apps/wedding-invite',
                appPort: 1060,
                pnpmFilters: 'wedding-invite,@bubu-log/ui,@bubu-log/typescript-config',
                triggers: ['apps/wedding-invite/', 'packages/ui/', 'packages/typescript-config/'],
              },
            ]

            const affectAll = changed.some((file) =>
              alwaysAffectAll.some((prefix) => file === prefix || file.startsWith(prefix))
            )

            const affected = projects.filter((project) => {
              if (affectAll) return true
              return changed.some((file) => project.triggers.some((prefix) => file.startsWith(prefix)))
            })

            core.info(`Changed files: ${changed.length}`)
            core.info(`Affect all projects: ${affectAll}`)
            core.info(`Affected projects: ${affected.map((p) => p.appId).join(', ') || '(none)'}`)

            core.setOutput('matrix_json', JSON.stringify({ include: affected }))
            core.setOutput('all_projects_json', JSON.stringify(projects.map((p) => ({ appId: p.appId, appName: p.appName }))))
            core.setOutput('affected_json', JSON.stringify(affected.map((p) => ({ appId: p.appId, appName: p.appName }))))
            core.setOutput('preview_count', String(affected.length))

      - name: Remove legacy per-app preview comments
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- e2b-pr-preview:'
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })

            const legacy = comments.filter((comment) =>
              comment.body && comment.body.includes(marker)
            )

            for (const item of legacy) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: item.id,
              })
            }
            core.info(`Removed ${legacy.length} legacy per-app preview comments.`)

  preview:
    needs: detect-affected
    if: needs.detect-affected.outputs.preview_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.matrix_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2B SDK
        run: npm install --no-save e2b@2.13.0

      - name: Resolve app-specific E2B credentials
        id: resolve
        env:
          BUBU_LOG_E2B_API_KEY: ${{ secrets.BUBU_LOG_E2B_API_KEY }}
          BUBU_LOG_E2B_PREVIEW_ENV_B64: ${{ secrets.E2B_PREVIEW_ENV_B64 }}
          BUBU_LOG_E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE }}
          BUBU_LOG_E2B_TIMEOUT_MS: ${{ vars.E2B_TIMEOUT_MS }}

          NUNU_ISLAND_E2B_API_KEY: ${{ secrets.NUNU_ISLAND_E2B_API_KEY }}
          NUNU_ISLAND_E2B_PREVIEW_ENV_B64: ${{ secrets.NUNU_ISLAND_E2B_PREVIEW_ENV_B64 }}
          NUNU_ISLAND_E2B_TEMPLATE: ${{ vars.NUNU_ISLAND_E2B_TEMPLATE }}
          NUNU_ISLAND_E2B_TIMEOUT_MS: ${{ vars.NUNU_ISLAND_E2B_TIMEOUT_MS }}

          NUNU_LOG_E2B_API_KEY: ${{ secrets.NUNU_LOG_E2B_API_KEY }}
          NUNU_LOG_E2B_PREVIEW_ENV_B64: ${{ secrets.NUNU_LOG_E2B_PREVIEW_ENV_B64 }}
          NUNU_LOG_E2B_TEMPLATE: ${{ vars.NUNU_LOG_E2B_TEMPLATE }}
          NUNU_LOG_E2B_TIMEOUT_MS: ${{ vars.NUNU_LOG_E2B_TIMEOUT_MS }}

          WEDDING_INVITE_E2B_API_KEY: ${{ secrets.WEDDING_INVITE_E2B_API_KEY }}
          WEDDING_INVITE_E2B_PREVIEW_ENV_B64: ${{ secrets.WEDDING_INVITE_E2B_PREVIEW_ENV_B64 }}
          WEDDING_INVITE_E2B_TEMPLATE: ${{ vars.WEDDING_INVITE_E2B_TEMPLATE }}
          WEDDING_INVITE_E2B_TIMEOUT_MS: ${{ vars.WEDDING_INVITE_E2B_TIMEOUT_MS }}
        run: |
          APP_ID='${{ matrix.appId }}'

          API_KEY=''
          PREVIEW_ENV_B64=''
          TEMPLATE=''
          TIMEOUT_MS=''

          case "$APP_ID" in
            bubu-log)
              API_KEY="$BUBU_LOG_E2B_API_KEY"
              PREVIEW_ENV_B64="$BUBU_LOG_E2B_PREVIEW_ENV_B64"
              TEMPLATE="$BUBU_LOG_E2B_TEMPLATE"
              TIMEOUT_MS="$BUBU_LOG_E2B_TIMEOUT_MS"
              ;;
            nunu-island)
              API_KEY="${NUNU_ISLAND_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              PREVIEW_ENV_B64="${NUNU_ISLAND_E2B_PREVIEW_ENV_B64:-$BUBU_LOG_E2B_PREVIEW_ENV_B64}"
              TEMPLATE="${NUNU_ISLAND_E2B_TEMPLATE:-$BUBU_LOG_E2B_TEMPLATE}"
              TIMEOUT_MS="${NUNU_ISLAND_E2B_TIMEOUT_MS:-$BUBU_LOG_E2B_TIMEOUT_MS}"
              ;;
            nunu-log)
              API_KEY="${NUNU_LOG_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              PREVIEW_ENV_B64="${NUNU_LOG_E2B_PREVIEW_ENV_B64:-$BUBU_LOG_E2B_PREVIEW_ENV_B64}"
              TEMPLATE="${NUNU_LOG_E2B_TEMPLATE:-$BUBU_LOG_E2B_TEMPLATE}"
              TIMEOUT_MS="${NUNU_LOG_E2B_TIMEOUT_MS:-$BUBU_LOG_E2B_TIMEOUT_MS}"
              ;;
            wedding-invite)
              API_KEY="${WEDDING_INVITE_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              PREVIEW_ENV_B64="${WEDDING_INVITE_E2B_PREVIEW_ENV_B64:-$BUBU_LOG_E2B_PREVIEW_ENV_B64}"
              TEMPLATE="${WEDDING_INVITE_E2B_TEMPLATE:-$BUBU_LOG_E2B_TEMPLATE}"
              TIMEOUT_MS="${WEDDING_INVITE_E2B_TIMEOUT_MS:-$BUBU_LOG_E2B_TIMEOUT_MS}"
              ;;
            *)
              ;;
          esac

          if [ -z "$API_KEY" ] || [ -z "$PREVIEW_ENV_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-credentials" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          fi

          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "preview_env_b64=$PREVIEW_ENV_B64" >> "$GITHUB_OUTPUT"
          echo "template=$TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "timeout_ms=$TIMEOUT_MS" >> "$GITHUB_OUTPUT"

      - name: Create E2B preview sandbox
        id: create_preview
        if: steps.resolve.outputs.enabled == 'true'
        continue-on-error: true
        run: node .github/scripts/e2b-preview.mjs create
        env:
          E2B_API_KEY: ${{ steps.resolve.outputs.api_key }}
          E2B_TEMPLATE: ${{ steps.resolve.outputs.template }}
          E2B_TIMEOUT_MS: ${{ steps.resolve.outputs.timeout_ms }}
          E2B_APP_ID: ${{ matrix.appId }}
          E2B_APP_NAME: ${{ matrix.appName }}
          E2B_APP_PORT: ${{ matrix.appPort }}
          E2B_APP_PATH: ${{ matrix.appPath }}
          E2B_PNPM_FILTERS: ${{ matrix.pnpmFilters }}
          E2B_PREVIEW_PURPOSE: pr-preview-multiapp
          E2B_PREVIEW_ENV_B64: ${{ steps.resolve.outputs.preview_env_b64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2B_LOG_FILE: ${{ runner.temp }}/e2b-preview-${{ matrix.appId }}.log

      - name: Persist preview result
        run: |
          mkdir -p "$RUNNER_TEMP/e2b-result"
          RESULT_FILE="$RUNNER_TEMP/e2b-result/${{ matrix.appId }}.json"

          if [ '${{ steps.resolve.outputs.enabled }}' != 'true' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "skipped",
            "reason": "missing-credentials"
          }
          EOF
          elif [ '${{ steps.create_preview.outcome }}' = 'success' ]; then
            cat > "$RESULT_FILE" <<EOF
          ${{ steps.create_preview.outputs.result_json }}
          EOF
          else
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "preview-create-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          fi

      - name: Upload E2B preview logs
        if: always() && steps.resolve.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2b-preview-log-${{ matrix.appId }}-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/e2b-preview-${{ matrix.appId }}.log
          if-no-files-found: warn

      - name: Upload E2B preview result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2b-preview-result-${{ matrix.appId }}
          path: ${{ runner.temp }}/e2b-result/${{ matrix.appId }}.json
          if-no-files-found: error

      - name: Upsert app preview comment
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/e2b-result/${{ matrix.appId }}.json
          APP_ID: ${{ matrix.appId }}
          ALL_PROJECTS_JSON: ${{ needs.detect-affected.outputs.all_projects_json }}
          AFFECTED_JSON: ${{ needs.detect-affected.outputs.affected_json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('node:fs')

            const marker = '<!-- e2b-pr-preview -->'
            const statePrefix = '<!-- e2b-pr-preview-state '
            const issue_number = context.issue.number
            const updated = new Date().toISOString().replace('T', ' ').replace(/\.\d+Z$/, 'Z')
            const allProjects = JSON.parse(process.env.ALL_PROJECTS_JSON || '[]')
            const affectedProjects = JSON.parse(process.env.AFFECTED_JSON || '[]')
            const affectedSet = new Set(affectedProjects.map((item) => item.appId))

            let result = {
              appId: process.env.APP_ID,
              appName: process.env.APP_ID,
              status: 'failed',
              reason: 'missing-result-file',
              runUrl: process.env.RUN_URL,
            }

            try {
              const raw = fs.readFileSync(process.env.RESULT_FILE, 'utf8')
              result = JSON.parse(raw)
            } catch (error) {
              core.warning(`Failed to read preview result for ${process.env.APP_ID}: ${error}`)
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })

            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            )

            let existingState = {}
            if (existing?.body) {
              const match = existing.body.match(/<!-- e2b-pr-preview-state ([\s\S]*?) -->/)
              if (match?.[1]) {
                try {
                  existingState = JSON.parse(match[1])
                } catch (error) {
                  core.warning(`Failed to parse existing preview state: ${error}`)
                }
              }
            }

            const nextState = {}
            for (const project of allProjects) {
              if (affectedSet.has(project.appId)) {
                nextState[project.appId] = {
                  appId: project.appId,
                  appName: project.appName,
                  status: 'running',
                  reason: 'waiting-for-result',
                  runUrl: process.env.RUN_URL,
                }
              } else {
                nextState[project.appId] = {
                  appId: project.appId,
                  appName: project.appName,
                  status: 'skipped',
                  reason: 'not-affected',
                }
              }
            }

            for (const [appId, state] of Object.entries(existingState)) {
              if (nextState[appId]) {
                nextState[appId] = { ...nextState[appId], ...state }
              }
            }
            nextState[result.appId] = { ...nextState[result.appId], ...result }

            const toRow = (project) => {
              const item = nextState[project.appId] || {
                appId: project.appId,
                appName: project.appName,
                status: 'skipped',
                reason: 'not-affected',
              }
              const status = item.status || 'failed'
              const icon = status === 'ready'
                ? '![Ready](https://vercel.com/static/status/ready.svg)'
                : status === 'failed'
                  ? '![Error](https://vercel.com/static/status/error.svg)'
                  : status === 'running'
                    ? '![Building](https://vercel.com/static/status/building.svg)'
                    : '![Skipped](https://vercel.com/static/status/canceled.svg)'
              const statusLabel = status === 'ready'
                ? 'Ready'
                : status === 'failed'
                  ? 'Failed'
                  : status === 'running'
                    ? 'Running'
                    : 'Skipped'

              const actions = []
              if (item.previewUrl) {
                actions.push(`[Preview](${item.previewUrl})`)
              }
              if (item.sandboxId) {
                const sandboxUrl = item.sandboxUrl || `https://e2b.dev/dashboard?search=${encodeURIComponent(item.sandboxId)}`
                actions.push(`[Sandbox](${sandboxUrl})`)
              }
              if (status === 'failed') {
                actions.push(`[Logs](${item.runUrl || process.env.RUN_URL})`)
              }

              return `| ${project.appName} | ${icon} ${statusLabel} | ${actions.join(', ') || '-'} | ${updated} |`
            }

            const body = [
              marker,
              `<!-- e2b-pr-preview-state ${JSON.stringify(nextState)} -->`,
              '### E2B Preview',
              '',
              '| Project | Deployment | Actions | Updated (UTC) |',
              '| :--- | :----- | :------ | :------ |',
              ...allProjects.map(toRow),
              '',
              '_This preview is ephemeral and will be recreated on new commits._',
            ].join('\n')

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              })
            }

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - appId: bubu-log
            appName: bubu-log
          - appId: nunu-island
            appName: nunu-island
          - appId: nunu-log
            appName: nunu-log
          - appId: wedding-invite
            appName: wedding-invite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2B SDK
        run: npm install --no-save e2b@2.13.0

      - name: Resolve cleanup API key
        id: resolve_cleanup
        env:
          BUBU_LOG_E2B_API_KEY: ${{ secrets.BUBU_LOG_E2B_API_KEY }}
          NUNU_ISLAND_E2B_API_KEY: ${{ secrets.NUNU_ISLAND_E2B_API_KEY }}
          NUNU_LOG_E2B_API_KEY: ${{ secrets.NUNU_LOG_E2B_API_KEY }}
          WEDDING_INVITE_E2B_API_KEY: ${{ secrets.WEDDING_INVITE_E2B_API_KEY }}
        run: |
          APP_ID='${{ matrix.appId }}'
          API_KEY=''

          case "$APP_ID" in
            bubu-log)
              API_KEY="$BUBU_LOG_E2B_API_KEY"
              ;;
            nunu-island)
              API_KEY="${NUNU_ISLAND_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              ;;
            nunu-log)
              API_KEY="${NUNU_LOG_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              ;;
            wedding-invite)
              API_KEY="${WEDDING_INVITE_E2B_API_KEY:-$BUBU_LOG_E2B_API_KEY}"
              ;;
            *)
              ;;
          esac

          if [ -z "$API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"

      - name: Cleanup E2B preview sandbox
        id: cleanup_preview
        if: steps.resolve_cleanup.outputs.enabled == 'true'
        run: node .github/scripts/e2b-preview.mjs cleanup
        env:
          E2B_API_KEY: ${{ steps.resolve_cleanup.outputs.api_key }}
          E2B_APP_ID: ${{ matrix.appId }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          E2B_PREVIEW_PURPOSE: pr-preview-multiapp
          E2B_LOG_FILE: ${{ runner.temp }}/e2b-preview-cleanup-${{ matrix.appId }}.log

      - name: Upload E2B cleanup logs
        if: always() && steps.resolve_cleanup.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2b-preview-cleanup-log-${{ matrix.appId }}-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/e2b-preview-cleanup-${{ matrix.appId }}.log
          if-no-files-found: warn
