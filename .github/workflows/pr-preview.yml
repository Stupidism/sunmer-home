name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-affected:
    name: Detect Affected Apps
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      affected_json: ${{ steps.detect.outputs.affected_json }}
      unaffected_json: ${{ steps.detect.outputs.unaffected_json }}
      all_projects_json: ${{ steps.detect.outputs.all_projects_json }}
      affected_names_json: ${{ steps.detect.outputs.affected_names_json }}
      affected_count: ${{ steps.detect.outputs.affected_count }}
      unaffected_count: ${{ steps.detect.outputs.unaffected_count }}
    steps:
      - name: Checkout config and scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/projects.json
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Detect affected projects and label PR
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const { detectAffected } = await import('${{ github.workspace }}/.github/scripts/detect-affected.mjs')

            const { projects, affected, unaffected, skipped } = await detectAffected({
              github,
              context,
              core,
              extraAffectAll: ['.github/workflows/pr-preview.yml'],
            })

            if (skipped) {
              core.info('Non-app label event, nothing to do')
              core.setOutput('affected_count', '0')
              core.setOutput('unaffected_count', '0')
              return
            }

            core.setOutput('affected_json', JSON.stringify({ include: affected }))
            core.setOutput('unaffected_json', JSON.stringify({ include: unaffected.map((p) => ({ appId: p.appId, projectId: p.neonProjectId })) }))
            core.setOutput('all_projects_json', JSON.stringify(projects.map((p) => ({ appId: p.appId, appName: p.appName }))))
            core.setOutput('affected_names_json', JSON.stringify(affected.map((p) => ({ appId: p.appId, appName: p.appName }))))
            core.setOutput('affected_count', String(affected.length))
            core.setOutput('unaffected_count', String(unaffected.length))

  preview:
    name: Deploy Preview (${{ matrix.appId }})
    needs: detect-affected
    if: needs.detect-affected.outputs.affected_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.affected_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Vercel project and org id
        id: resolve
        env:
          VERCEL_PROJECT_ID_BUBU_LOG: ${{ vars.VERCEL_PROJECT_ID_BUBU_LOG }}
          VERCEL_PROJECT_ID_NUNU_ISLAND: ${{ vars.VERCEL_PROJECT_ID_NUNU_ISLAND }}
          VERCEL_PROJECT_ID_NUNU_LOG: ${{ vars.VERCEL_PROJECT_ID_NUNU_LOG }}
          VERCEL_PROJECT_ID_WEDDING_INVITE: ${{ vars.VERCEL_PROJECT_ID_WEDDING_INVITE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          APP_ID='${{ matrix.appId }}'
          PROJECT_ID=''
          ORG_ID=''

          case "$APP_ID" in
            bubu-log)
              PROJECT_ID="$VERCEL_PROJECT_ID_BUBU_LOG"
              ;;
            nunu-island)
              PROJECT_ID="$VERCEL_PROJECT_ID_NUNU_ISLAND"
              ;;
            nunu-log)
              PROJECT_ID="$VERCEL_PROJECT_ID_NUNU_LOG"
              ;;
            wedding-invite)
              PROJECT_ID="$VERCEL_PROJECT_ID_WEDDING_INVITE"
              ;;
            *)
              ;;
          esac

          if [ -n "$VERCEL_TEAM_ID" ]; then
            ORG_ID="$VERCEL_TEAM_ID"
          elif [ -n "$VERCEL_SCOPE" ] && [[ "$VERCEL_SCOPE" == team_* ]]; then
            ORG_ID="$VERCEL_SCOPE"
          elif [ -n "$VERCEL_SCOPE" ]; then
            ORG_ID=$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams/$VERCEL_SCOPE" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);if(j.id)process.stdout.write(j.id)}catch{}})" \
              || true)

            if [ -z "$ORG_ID" ]; then
              ORG_ID=$(curl -fsSL -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams?slug=$VERCEL_SCOPE" \
                | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);if(Array.isArray(j.teams)&&j.teams[0]&&j.teams[0].id)process.stdout.write(j.teams[0].id)}catch{}})" \
                || true)
            fi
          fi

          if [ -z "$PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ] || [ -z "$ORG_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-vercel-credentials" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "reason=ready" >> "$GITHUB_OUTPUT"
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "scope=${VERCEL_SCOPE:-$ORG_ID}" >> "$GITHUB_OUTPUT"

      - name: Create Neon preview branch
        id: create_neon_branch
        if: steps.resolve.outputs.enabled == 'true'
        uses: neondatabase/create-branch-action@v6
        continue-on-error: true
        with:
          project_id: ${{ matrix.neonProjectId }}
          branch_name: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Pull Vercel preview env
        id: pull_vercel_preview_env
        if: steps.resolve.outputs.enabled == 'true' && steps.create_neon_branch.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ steps.resolve.outputs.org_id }}
          VERCEL_SCOPE: ${{ steps.resolve.outputs.scope }}
          VERCEL_PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: pnpm dlx vercel@latest pull --yes --environment=preview --git-branch="$VERCEL_GIT_BRANCH" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Run preview DB migrations for wedding-invite
        id: migrate_wedding_preview_db
        if: steps.resolve.outputs.enabled == 'true' && steps.create_neon_branch.outcome == 'success' && matrix.appId == 'wedding-invite'
        continue-on-error: true
        run: |
          if [ ! -f .vercel/.env.preview.local ]; then
            echo "Missing .vercel/.env.preview.local after vercel pull" >&2
            exit 1
          fi

          set -a
          source .vercel/.env.preview.local
          set +a

          pnpm --filter wedding-invite db:push

      - name: Build preview artifacts
        id: build_preview_artifacts
        if: steps.resolve.outputs.enabled == 'true' && steps.create_neon_branch.outcome == 'success' && (matrix.appId != 'wedding-invite' || steps.migrate_wedding_preview_db.outcome == 'success')
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ steps.resolve.outputs.org_id }}
          VERCEL_SCOPE: ${{ steps.resolve.outputs.scope }}
          VERCEL_PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@latest build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy preview artifacts
        id: deploy_preview
        if: steps.resolve.outputs.enabled == 'true' && steps.build_preview_artifacts.outcome == 'success'
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ steps.resolve.outputs.org_id }}
          VERCEL_SCOPE: ${{ steps.resolve.outputs.scope }}
          VERCEL_PROJECT_ID: ${{ steps.resolve.outputs.project_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          DEPLOY_OUTPUT=$(pnpm dlx vercel@latest deploy --prebuilt --yes --public --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --meta "githubDeployment=1" --meta "githubPr=$PR_NUMBER" --meta "githubCommitSha=$PR_HEAD_SHA" --meta "githubCommitRef=$PR_HEAD_REF" --meta "githubOrg=$REPO_OWNER" --meta "githubRepo=$REPO_NAME" 2>&1) || true
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(printf '%s' "$DEPLOY_OUTPUT" | perl -ne 'while (/(https:\/\/[\w.-]+\.vercel\.app(?:\/[^\s"\)]*)?)/g) { $u=$1 } END { print $u if defined $u }')
          BUILD_URL=$(printf '%s' "$DEPLOY_OUTPUT" | perl -ne 'while (/(https:\/\/vercel\.com\/[^\s\]]+)/g) { $u=$1 } END { print $u if defined $u }')

          if [ -z "$DEPLOY_URL" ]; then
            echo "Failed to parse deploy URL from Vercel output" >&2
            exit 1
          fi

          echo "preview_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Probe deployed preview routes
        if: steps.resolve.outputs.enabled == 'true' && steps.deploy_preview.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "Missing preview URL" >&2
            exit 1
          fi

          probe() {
            local path="$1"
            local url="${PREVIEW_URL}${path}"
            local code
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              code=$(curl -sS -o /dev/null -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" -H "x-vercel-set-bypass-cookie: true" "$url")
            else
              code=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
            fi
            echo "Probe ${url} => HTTP ${code}"

            if [ "$code" -eq 401 ]; then
              echo "Route ${url} is protected by Vercel deployment protection"
              return 0
            fi

            if [ "$code" -ge 400 ]; then
              echo "Route ${url} is not reachable" >&2
              exit 1
            fi
          }

          probe "/"
          probe "/admin/login"

      - name: Persist preview result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/vercel-preview-result"
          RESULT_FILE="$RUNNER_TEMP/vercel-preview-result/${{ matrix.appId }}.json"

          if [ '${{ steps.resolve.outputs.enabled }}' != 'true' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "skipped",
            "reason": "missing-vercel-credentials",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          elif [ '${{ steps.deploy_preview.outcome }}' = 'success' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "ready",
            "reason": "ready",
            "previewUrl": "${{ steps.deploy_preview.outputs.preview_url }}",
            "buildUrl": "${{ steps.deploy_preview.outputs.build_url }}",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          elif [ '${{ steps.create_neon_branch.outcome }}' = 'failure' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "neon-branch-create-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          elif [ '${{ steps.pull_vercel_preview_env.outcome }}' = 'failure' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "preview-pull-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          elif [ '${{ steps.build_preview_artifacts.outcome }}' = 'failure' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "preview-build-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          elif [ '${{ steps.migrate_wedding_preview_db.outcome }}' = 'failure' ]; then
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "preview-db-migrate-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          else
            cat > "$RESULT_FILE" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "status": "failed",
            "reason": "preview-deploy-failed",
            "runUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "headSha": "${{ github.event.pull_request.head.sha }}"
          }
          EOF
          fi

      - name: Upload Vercel preview result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-result-${{ matrix.appId }}
          path: ${{ runner.temp }}/vercel-preview-result/${{ matrix.appId }}.json
          if-no-files-found: error

      - name: Upsert preview comment
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_FILE: ${{ runner.temp }}/vercel-preview-result/${{ matrix.appId }}.json
          APP_ID: ${{ matrix.appId }}
          ALL_PROJECTS_JSON: ${{ needs.detect-affected.outputs.all_projects_json }}
          AFFECTED_JSON: ${{ needs.detect-affected.outputs.affected_names_json }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { upsertPreviewComment } = await import('${{ github.workspace }}/.github/scripts/upsert-preview-comment.mjs')
            await upsertPreviewComment({ github, context, core })

      - name: Fail job if deploy did not succeed
        if: always()
        run: |
          if [ '${{ steps.resolve.outputs.enabled }}' != 'true' ]; then
            echo "Skipped: Vercel credentials not configured"
            exit 0
          fi

          if [ '${{ steps.deploy_preview.outcome }}' != 'success' ]; then
            echo "::error::Deploy failed for ${{ matrix.appId }} (outcome: ${{ steps.deploy_preview.outcome }})"
            exit 1
          fi

  cleanup-unaffected:
    name: Cleanup Neon Branch (${{ matrix.appId }})
    needs: detect-affected
    if: needs.detect-affected.outputs.unaffected_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-affected.outputs.unaffected_json) }}
    steps:
      - name: Cleanup Neon Branch
        uses: neondatabase/delete-branch-action@v3
        continue-on-error: true
        with:
          project_id: ${{ matrix.projectId }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

  cleanup-closed:
    name: Cleanup All Neon Branches
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/projects.json
            .github/scripts/cleanup-neon-branches.mjs
          sparse-checkout-cone-mode: false

      - name: Cleanup all Neon branches
        uses: actions/github-script@v7
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        with:
          script: |
            const { cleanupNeonBranches } = await import('${{ github.workspace }}/.github/scripts/cleanup-neon-branches.mjs')
            await cleanupNeonBranches({ core, branchName: 'preview/${{ github.event.pull_request.head.ref }}' })

      - name: Mark preview comment closed
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- vercel-pr-preview -->'
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })

            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            )

            if (!existing) {
              core.info('No Vercel preview comment found.')
              return
            }

            const closedNote = '\n\n_This PR is closed. Existing preview deployments may be garbage-collected by Vercel._'
            if (existing.body.includes(closedNote.trim())) {
              core.info('Close note already present; skip update.')
              return
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: `${existing.body}${closedNote}`,
            })
