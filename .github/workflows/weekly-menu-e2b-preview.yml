name: Weekly Menu E2B PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
    paths:
      - 'apps/weekly-menu/**'
      - '.github/workflows/weekly-menu-e2b-preview.yml'
      - '.github/scripts/e2b-preview.mjs'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  preview:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-menu-e2b-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2B SDK
        run: npm install --no-save e2b@2.13.0

      - name: Validate E2B secrets
        id: validate
        env:
          E2B_API_KEY: ${{ secrets.WEEKLY_MENU_E2B_API_KEY }}
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create E2B preview sandbox
        id: create_preview
        if: steps.validate.outputs.enabled == 'true'
        continue-on-error: true
        run: node .github/scripts/e2b-preview.mjs create
        env:
          E2B_API_KEY: ${{ secrets.WEEKLY_MENU_E2B_API_KEY }}
          E2B_TEMPLATE: ${{ vars.WEEKLY_MENU_E2B_TEMPLATE }}
          E2B_TIMEOUT_MS: ${{ vars.WEEKLY_MENU_E2B_TIMEOUT_MS }}
          E2B_APP_PORT: 1040
          E2B_APP_PATH: apps/weekly-menu
          E2B_PNPM_FILTERS: --filter weekly-menu
          E2B_PREVIEW_PURPOSE: pr-preview-weekly-menu
          E2B_PREVIEW_ENV_B64: ${{ secrets.WEEKLY_MENU_E2B_PREVIEW_ENV_B64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2B_LOG_FILE: ${{ runner.temp }}/weekly-menu-e2b-preview.log

      - name: Upload E2B preview logs
        if: always() && steps.validate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-menu-e2b-preview-log-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/weekly-menu-e2b-preview.log
          if-no-files-found: warn

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          PREVIEW_ENABLED: ${{ steps.validate.outputs.enabled }}
          PREVIEW_OUTCOME: ${{ steps.create_preview.outcome }}
          PREVIEW_URL: ${{ steps.create_preview.outputs.preview_url }}
          SANDBOX_ID: ${{ steps.create_preview.outputs.sandbox_id }}
          KILLED_COUNT: ${{ steps.create_preview.outputs.killed_count }}
          HEAD_SHA: ${{ steps.create_preview.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- e2b-pr-preview-weekly-menu -->'
            const body = process.env.PREVIEW_ENABLED === 'true'
              ? (
                  process.env.PREVIEW_OUTCOME === 'success'
                    ? [
                        marker,
                        '### Weekly Menu E2B Preview',
                        '',
                        `- URL: ${process.env.PREVIEW_URL}`,
                        `- Sandbox: \`${process.env.SANDBOX_ID}\``,
                        `- Replaced old sandboxes: ${process.env.KILLED_COUNT || '0'}`,
                        `- Commit: \`${(process.env.HEAD_SHA || '').slice(0, 12)}\``,
                        '',
                        '_This preview is ephemeral and will be recreated on new commits._',
                      ].join('\n')
                    : [
                        marker,
                        '### Weekly Menu E2B Preview',
                        '',
                        '- Preview creation failed in this run (likely sandbox resource limit).',
                        `- Logs: ${process.env.RUN_URL}`,
                        '- Action: set `WEEKLY_MENU_E2B_TEMPLATE` to a larger template, then rerun this workflow.',
                      ].join('\n')
                )
              : [
                  marker,
                  '### Weekly Menu E2B Preview',
                  '',
                  '- Skipped: missing `WEEKLY_MENU_E2B_API_KEY` secret for this workflow context.',
                ].join('\n')

            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              })
            }

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-menu-e2b-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2B SDK
        run: npm install --no-save e2b@2.13.0

      - name: Validate E2B secrets
        id: validate_cleanup
        env:
          E2B_API_KEY: ${{ secrets.WEEKLY_MENU_E2B_API_KEY }}
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup E2B preview sandbox
        id: cleanup_preview
        if: steps.validate_cleanup.outputs.enabled == 'true'
        run: node .github/scripts/e2b-preview.mjs cleanup
        env:
          E2B_API_KEY: ${{ secrets.WEEKLY_MENU_E2B_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          E2B_PREVIEW_PURPOSE: pr-preview-weekly-menu
          E2B_LOG_FILE: ${{ runner.temp }}/weekly-menu-e2b-preview-cleanup.log

      - name: Upload E2B cleanup logs
        if: always() && steps.validate_cleanup.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-menu-e2b-preview-cleanup-log-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/weekly-menu-e2b-preview-cleanup.log
          if-no-files-found: warn

      - name: Add cleanup comment
        uses: actions/github-script@v7
        env:
          KILLED_COUNT: ${{ steps.cleanup_preview.outputs.killed_count }}
        with:
          script: |
            const marker = '<!-- e2b-pr-preview-weekly-menu -->'
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (!existing) return

            const body = [
              marker,
              '### Weekly Menu E2B Preview',
              '',
              `PR closed. Cleaned up sandbox count: ${process.env.KILLED_COUNT || '0'}.`,
            ].join('\n')

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
